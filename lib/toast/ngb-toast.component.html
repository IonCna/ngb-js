<div ng-if="$.header && !$.elementTranscluded" class="toast-header">
    <strong class="me-auto">{{ $.header }}</strong>

    <button ng-click="$.close()" type="button" aria-label="Close" class="btn-close"></button>
</div>

<div ng-show="$.elementTranscluded" class="toast-header">
    <div class="me-auto" NgbToastHeaderWrapper></div>
    <button ng-click="$.close()" type="button" aria-label="Close" class="btn-close"></button>
</div>

<div class="toast-body" ng-transclude>
</div>
