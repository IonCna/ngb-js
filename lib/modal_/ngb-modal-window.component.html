<div
    class="modal-dialog"
    dialog-host
    ng-class="[
        $.config.centered && 'modal-dialog-centered',
        $.config.size && ('modal-' + $.config.size),
        $.config.modalDialogClass,
        $.config.scrollable && 'modal-dialog-scrollable',
        $.fullscreenClass
    ]">
    <div class="modal-content" modal-host></div>
</div>
