<div
    ng-style="{ 'width':  $.ngbProgressbarStacked ? '100%' : $.percent }"
    class="progress-bar"
    ng-class="[
        $.type ? ($.textType ? ('bg-' + $.type) : ('text-bg-' + $.type)) : '',
        $.text,
        { 'progress-bar-animated': $.animated },
        { 'progress-bar-striped': $.striped }]" ng-transclude>
    <span ng-if="$.showValue">{{ $.displayValue / $.displayMax | ngbPercent }}</span>
</div>
