<div class="carousel-indicators" ng-class="{ 'visually-hidden': !$.showNavigationIndicators }" role="tablist">
    <button title="indicator {{ $index }}" ng-repeat="$slide in $.slides.toArray() track by $index" type="button" data-bs-target
        ng-class="{ 'active': $slide.id === $.activeId }" role="tab" ng-attr-aria-labelledby="slide-{{ $slide.id }}"
        ng-attr-aria-controls="slide-{{ $slide.id }}" ng-attr-aria-selected="{{ $slide.id === $.activeId }}"
        ng-click="$.focus(); $.select($slide.id, $.NgbSlideEventSource.INDICATOR)"></button>
</div>

<div class="carousel-inner">
    <div ng-repeat="$slide in $.slides.toArray() track by $index" ng-init="$count = $.slides.length" class="carousel-item"
        ng-attr-id="slide-{{ $slide.id }}" role="tabpanel">
        <span class="visually-hidden">
            Slide {{ $index + 1 }} of {{ $count }}
        </span>

        <ng-container ng-template-outlet="$.getSlideTemplate($index)"></ng-container>
    </div>
</div>

<button ng-if="$.showNavigationArrows" class="carousel-control-prev" type="button"
    ng-attr-aria-labelledby="{{ $.id }}-previous" ng-click="$.arrowLeft()">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden" ng-attr-id="{{ $.id }}-previous">Previous</span>
</button>

<button ng-if="$.showNavigationArrows" class="carousel-control-next" type="button"
    ng-attr-aria-labelledby="{{ $.id }}-next" ng-click="$.arrowRight()">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden" ng-attr-id="{{ $.id }}-next">Next</span>
</button>

<ng-content></ng-content>
