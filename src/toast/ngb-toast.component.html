<div ng-if="$.contentHeaderTpl || $.header" class="toast-header">
    <ngb-content ng-if="$.contentHeaderTpl" $render="$.contentHeaderTpl"></ngb-content>
    <strong ng-if="!$.contentHeaderTpl && $.header" class="me-auto">{{ $.header }}</strong>
    <button type="button" class="btn-close" aria-label="Close" ng-click="$.hide()"></button>
</div>

<div class="toast-body" ng-transclude></div>
