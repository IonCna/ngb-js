<div
  ng-ref="dialog"
  ng-class="
    'modal-dialog' +
    ($.size ? ' modal-' + $.size : '') +
    ($.centered ? ' modal-dialog-centered' : '') +
    $.fullscreenClass +
    ($.scrollable ? ' modal-dialog-scrollable' : '') +
    ($.modalDialogClass ? ' ' + $.modalDialogClass : '')
  "
  role="document"
>
  <div class="modal-content"><ng-content></ng-content></div>
</div>
