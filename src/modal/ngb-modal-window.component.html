<div
    ng-ref="dialog"
    role="document"
    class="modal-dialog"
    ng-class="[
        $.fullscreen === true ? 'modal-fullscreen' : ($.fullscreen ? 'modal-fullscreen-' + $.fullscreen + '-down' : ''),
        $.size ? 'modal-' + $.size : '',
        $.centered ? 'modal-dialog-centered' : '',
        $.scrollable ? 'modal-dialog-scrollable' : '',
        $.modalDialogClass || ''
    ]">
    <div class="modal-content"><ng-content></ng-content></div>
</div>
