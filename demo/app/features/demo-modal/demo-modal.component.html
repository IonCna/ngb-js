<div class="container py-3">
    <h2 class="mb-3">Modal demo</h2>

    <!-- Options -->
    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleAnimation()">
            Animation: {{ $.animation ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleCentered()">
            Centered: {{ $.centered ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleScrollable()">
            Scrollable: {{ $.scrollable ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.cycleBackdrop()">
            Backdrop: {{ $.backdrop }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleKeyboard()">
            Keyboard: {{ $.keyboard ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.cycleSize()">
            Size: {{ $.size || 'default' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleFullscreen()">
            Fullscreen: {{ $.fullscreen ? 'on' : 'off' }}
        </button>
    </div>

    <!-- Actions -->
    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-primary" ng-click="$.open()">
            Open modal
        </button>
        <button type="button" class="btn btn-primary" ng-click="$.openTemplate()">
            Open TemplateRef modal
        </button>
        <button type="button" class="btn btn-warning" ng-click="$.openMultiple()">
            Open 3 modals
        </button>
        <button type="button" class="btn btn-secondary" ng-click="$.openScrollable()">
            Open scrollable modal
        </button>
        <button type="button" class="btn btn-secondary" ng-click="$.openUpdateOptions()">
            Open update options modal
        </button>
        <button type="button" class="btn btn-danger" ng-click="$.dismissAll()">
            Dismiss all
        </button>
    </div>

    <!-- State -->
    <div class="mb-3">
        <div><strong>Has open modals:</strong> {{ $.hasOpenModals() }}</div>
        <div><strong>Last result:</strong> {{ $.lastResult }}</div>
        <div><strong>Last dismissed:</strong> {{ $.lastDismissed }}</div>
    </div>

    <ng-template ng-ref="$.template" let-close="close" let-dismiss="dismiss">
        <div class="modal-header">
            <h4 class="modal-title">TemplateRef modal</h4>
            <button type="button" class="btn-close" aria-label="Close" ng-click="dismiss('template header close')"></button>
        </div>
        <div class="modal-body">
            <p>{{ $.templateMessage }}</p>
            <p class="text-muted mb-0">The close and dismiss functions come from the embedded-view context.</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" ng-click="dismiss('template cancel')">Dismiss</button>
            <button type="button" class="btn btn-primary" ng-click="close('template modal result')">Close with result</button>
        </div>
    </ng-template>
</div>
