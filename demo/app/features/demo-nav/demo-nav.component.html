<div class="container py-3">
    <h2 class="mb-3">Nav (Tabs) demo</h2>

    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleAnimation()">
            Animation: {{ $.animation ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleDestroyOnHide()">
            Destroy on hide: {{ $.destroyOnHide ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleOrientation()">
            Orientation: {{ $.orientation }}
        </button>
        <button type="button" class="btn btn-outline-secondary" ng-click="$.toggleSettingsDisabled()">
            Settings disabled: {{ $.settingsDisabled ? 'yes' : 'no' }}
        </button>
        <button type="button" class="btn btn-outline-danger" ng-click="$.togglePreventChange()">
            Prevent change: {{ $.preventChange ? 'on' : 'off' }}
        </button>
    </div>

    <div class="mb-3">
        <div><strong>Active tab:</strong> {{ $.activeId }}</div>
        <div ng-if="$.lastChange"><strong>Last navChange:</strong> {{ $.lastChange }}</div>
    </div>

    <div ng-class="{'d-flex align-items-start gap-3': $.orientation === 'vertical'}">
        <ul ngb-nav active-id="$.activeId" animation="$.animation" destroy-on-hide="$.destroyOnHide"
            orientation="$.orientation" nav-change="$.onNavChange($event)">
            <li ngb-nav-item="home">
                <button type="button" ngb-nav-link>Home</button>
                <div ngb-nav-content>
                    <p>This is the <strong>Home</strong> tab content.</p>
                </div>
            </li>
            <li ngb-nav-item="profile">
                <button type="button" ngb-nav-link>Profile</button>
                <div ngb-nav-content>
                    <p>This is the <strong>Profile</strong> tab content.</p>
                </div>
            </li>
            <li ngb-nav-item="settings" disabled="$.settingsDisabled">
                <button type="button" ngb-nav-link>Settings</button>
                <div ngb-nav-content>
                    <p>This is the <strong>Settings</strong> tab content.</p>
                </div>
            </li>
        </ul>
        <div ngb-nav-outlet></div>
    </div>
</div>
