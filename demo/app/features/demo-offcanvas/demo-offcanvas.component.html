<div class="container py-3">
    <h2 class="mb-3">Offcanvas demo</h2>

    <!-- Options -->
    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleAnimation()">
            Animation: {{ $.animation ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.cyclePosition()">
            Position: {{ $.position }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.cycleBackdrop()">
            Backdrop: {{ $.backdrop }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleKeyboard()">
            Keyboard: {{ $.keyboard ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleScroll()">
            Scroll: {{ $.scroll ? 'on' : 'off' }}
        </button>
    </div>

    <!-- Actions -->
    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-primary" ng-click="$.open()">
            Open offcanvas
        </button>
        <button type="button" class="btn btn-danger" ng-click="$.dismiss()">
            Dismiss
        </button>
    </div>

    <!-- State -->
    <div class="mb-3">
        <div><strong>Has open offcanvas:</strong> {{ $.hasOpenOffcanvas() }}</div>
        <div><strong>Last result:</strong> {{ $.lastResult }}</div>
        <div><strong>Last dismissed:</strong> {{ $.lastDismissed }}</div>
    </div>
</div>
