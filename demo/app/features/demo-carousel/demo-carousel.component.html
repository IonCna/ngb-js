<div class="container py-3">
    <h2 class="mb-3">Carousel demo</h2>

    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-primary" ng-click="$.toggleAnimation()">
            Animation: {{ $.animation ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleWrap()">
            Wrap: {{ $.wrap ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleKeyboard()">
            Keyboard: {{ $.keyboard ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.togglePauseOnFocus()">
            Pause on focus: {{ $.pauseOnFocus ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.togglePauseOnHover()">
            Pause on hover: {{ $.pauseOnHover ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleArrows()">
            Arrows: {{ $.showNavigationArrows ? 'on' : 'off' }}
        </button>
        <button type="button" class="btn btn-outline-primary" ng-click="$.toggleIndicators()">
            Indicators: {{ $.showNavigationIndicators ? 'on' : 'off' }}
        </button>
    </div>

    <div class="mb-3 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-outline-secondary" ng-click="$.setInterval(0)">
            Interval 0
        </button>
        <button type="button" class="btn btn-outline-secondary" ng-click="$.setInterval(2000)">
            Interval 2000
        </button>
        <button type="button" class="btn btn-outline-secondary" ng-click="$.setInterval(5000)">
            Interval 5000
        </button>
        <button type="button" class="btn btn-outline-dark" ng-click="$.select('slide-1')">
            Slide 1
        </button>
        <button type="button" class="btn btn-outline-dark" ng-click="$.select('slide-2')">
            Slide 2
        </button>
        <button type="button" class="btn btn-outline-dark" ng-click="$.select('slide-3')">
            Slide 3
        </button>
    </div>

    <div class="mb-3">
        <div><strong>activeId:</strong> {{ $.activeId }}</div>
        <div><strong>interval:</strong> {{ $.interval }}</div>
        <div><strong>last event:</strong> {{ $.lastEvent }}</div>
    </div>

    <ngb-carousel active-id="{{ $.activeId }}" animation="$.animation" interval="$.interval" keyboard="$.keyboard"
        pause-on-focus="$.pauseOnFocus" pause-on-hover="$.pauseOnHover" show-navigation-arrows="$.showNavigationArrows"
        show-navigation-indicators="$.showNavigationIndicators" wrap="$.wrap" slide="$.onSlide($event)"
        slid="$.onSlid($event)">
        <section ngb-slide id="slide-1">
            <div class="picsum-img-wrapper">
                <img class="d-block w-100" ng-src="{{ $.images[0] }}" alt="Random first slide" />
            </div>
            <div class="carousel-caption d-none d-md-block">
                <h5>First slide</h5>
                <p>Exercises activeId, animation and transition events.</p>
            </div>
        </section>

        <section ngb-slide id="slide-2">
            <div class="picsum-img-wrapper">
                <img class="d-block w-100" ng-src="{{ $.images[1] }}" alt="Random second slide" />
            </div>
            <div class="carousel-caption d-none d-md-block">
                <h5>Second slide</h5>
                <p>Use the controls above to stress the current port.</p>
            </div>
        </section>

        <section ngb-slide id="slide-3">
            <div class="picsum-img-wrapper">
                <img class="d-block w-100" ng-src="{{ $.images[2] }}" alt="Random third slide" />
            </div>
            <div class="carousel-caption d-none d-md-block">
                <h5>Third slide</h5>
                <p>Covers slide and slid outputs plus interval and wrap.</p>
            </div>
        </section>
    </ngb-carousel>
</div>
